<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>BITWatch AI 서버 관리 시스템</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css"
      integrity="sha512-4lKZfcia7bXwt8S6umbY0MNwXVGfx2J3AGcfQ1ao4RJgIIqfSaPYeVctdW00AfukbRfiFnb7ePNdkX+u3Eqdxw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg-gradient: radial-gradient(
          circle at 14% 18%,
          rgba(59, 130, 246, 0.55),
          rgba(15, 23, 42, 0.92) 55%
        );
        --panel-bg: rgba(15, 23, 42, 0.78);
        --panel-border: rgba(148, 163, 184, 0.16);
        --panel-shadow: 0 24px 40px rgba(8, 11, 19, 0.55);
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --badge-bg: rgba(148, 163, 184, 0.22);
        --highlight: rgba(56, 189, 248, 0.15);
        --track-color: rgba(15, 23, 42, 0.52);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Sans KR", system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, rgba(14, 23, 42, 0.96), rgba(21, 27, 45, 0.9)),
          var(--bg-gradient);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
      }

      header {
        padding: clamp(1.8rem, 4vw, 2.6rem) clamp(1.4rem, 4vw, 3rem) 1.2rem;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem 1.4rem;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(1.7rem, 4vw, 2.6rem);
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      .brand p {
        margin: 0;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.55rem 1.05rem;
        border-radius: 999px;
        border: 1px solid var(--panel-border);
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(14px);
        color: var(--text-secondary);
        font-size: 0.85rem;
        box-shadow: var(--panel-shadow);
      }

      main {
        flex: 1;
        display: grid;
        gap: 1.6rem;
        padding: 0 clamp(1.4rem, 4vw, 3rem) clamp(2.6rem, 6vw, 3.4rem);
      }

      .panel {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 1.2rem;
        padding: clamp(1.2rem, 3vw, 1.9rem);
        backdrop-filter: blur(16px);
        box-shadow: var(--panel-shadow);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .panel-head h2 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.25rem 0.7rem;
        border-radius: 999px;
        background: var(--badge-bg);
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--text-secondary);
        font-size: 0.75rem;
        font-weight: 600;
      }

      .gauge-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.4rem;
        margin-top: 1.3rem;
      }

      .gauge-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 1rem;
        padding: 1.2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
        position: relative;
      }

      .gauge-card h3 {
        margin: 0;
        font-size: 0.95rem;
        color: var(--text-secondary);
        font-weight: 500;
        letter-spacing: -0.005em;
      }

      .gauge {
        --value: 0;
        --color: #6366f1;
        position: relative;
        width: min(180px, 42vw);
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background: conic-gradient(
          var(--color) calc(var(--value) * 1%),
          rgba(148, 163, 184, 0.18) 0
        );
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 12px rgba(15, 23, 42, 0.6);
      }

      .gauge::after {
        content: "";
        position: absolute;
        inset: 18%;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.92);
        box-shadow: inset 0 10px 18px rgba(8, 12, 22, 0.65);
      }

      .gauge-center {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
        z-index: 1;
      }

      .gauge-value {
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: -0.015em;
      }

      .gauge-caption {
        font-size: 0.75rem;
        color: var(--text-secondary);
      }

      .metric-list {
        margin-top: 1.3rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 1rem;
      }

      .metric-list .metric-item {
        background: rgba(11, 18, 32, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 0.9rem;
        padding: 0.95rem 1.05rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .metric-list span.label {
        font-size: 0.78rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .metric-list span.value {
        font-size: 1.1rem;
        font-weight: 600;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1.1rem;
        background: rgba(8, 12, 20, 0.35);
        border-radius: 0.9rem;
        overflow: hidden;
      }

      th,
      td {
        padding: 0.7rem 0.8rem;
        text-align: left;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        font-size: 0.85rem;
      }

      th {
        font-size: 0.76rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: rgba(15, 23, 42, 0.55);
      }

      tbody tr:hover {
        background: rgba(56, 189, 248, 0.08);
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      .empty-state {
        text-align: center;
        padding: 1rem 0;
        color: var(--text-secondary);
        font-size: 0.88rem;
      }

      @media (max-width: 768px) {
        header {
          flex-direction: column;
          align-items: flex-start;
        }

        .gauge {
          width: min(200px, 60vw);
        }
      }

      @media (max-width: 540px) {
        header {
          padding: 1.6rem;
        }

        main {
          padding: 0 1.6rem 2.4rem;
        }

        .panel {
          border-radius: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>BITWatch AI 서버 관리 시스템</h1>
        <p>단일 서버의 자원과 이벤트를 안정적으로 수집하고 시각화합니다.</p>
      </div>
      <span class="status-pill" id="lastUpdated">마지막 업데이트 준비중...</span>
    </header>
    <main>
      <section class="panel">
        <div class="panel-head">
          <h2>자원 사용 현황</h2>
          <span class="tag" id="metricTimestamp">샘플 없음</span>
        </div>
        <div class="gauge-grid" id="gaugeGrid"></div>
        <div class="metric-list" id="networkStats"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>시스템 로그</h2>
          <span class="tag" id="syslogCount">0 건</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>수집 시각</th>
              <th>원본 시각</th>
              <th>메시지</th>
            </tr>
          </thead>
          <tbody id="syslogTable"></tbody>
        </table>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>IPMI SEL 이벤트</h2>
          <span class="tag" id="ipmiCount">0 건</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>수집 시각</th>
              <th>원본 시각</th>
              <th>메시지</th>
            </tr>
          </thead>
          <tbody id="ipmiTable"></tbody>
        </table>
      </section>
    </main>
    <script>
      const gaugeGrid = document.getElementById("gaugeGrid");
      const networkStats = document.getElementById("networkStats");
      const metricTimestamp = document.getElementById("metricTimestamp");
      const syslogTable = document.getElementById("syslogTable");
      const ipmiTable = document.getElementById("ipmiTable");
      const syslogCount = document.getElementById("syslogCount");
      const ipmiCount = document.getElementById("ipmiCount");
      const lastUpdated = document.getElementById("lastUpdated");

      const gaugeConfig = [
        { key: "cpu_percent", label: "CPU 사용률", color: "#6366f1" },
        { key: "memory_percent", label: "메모리 사용률", color: "#22d3ee" },
        { key: "disk_percent", label: "디스크 사용률", color: "#f59e0b" },
      ];

      const networkConfig = [
        { key: "net_sent", label: "송신 대역폭", suffix: " MB" },
        { key: "net_recv", label: "수신 대역폭", suffix: " MB" },
      ];

      async function fetchJSON(url) {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`요청 실패: ${response.status}`);
        }
        return response.json();
      }

      function clampPercent(value) {
        if (!Number.isFinite(value)) return 0;
        return Math.min(100, Math.max(0, value));
      }

      function renderUsageMetrics(metrics) {
        gaugeGrid.innerHTML = "";
        networkStats.innerHTML = "";

        if (!metrics.length) {
          metricTimestamp.textContent = "샘플 없음";
          gaugeGrid.innerHTML =
            '<p class="empty-state">아직 수집된 메트릭이 없습니다.</p>';
          return;
        }

        const latest = metrics[0];
        const stamp = latest.sampled_at || latest.recorded_at || "";
        metricTimestamp.textContent = stamp
          ? `샘플 시각: ${stamp.replace("T", " ").slice(0, 19)}`
          : "샘플 시각 정보 없음";

        gaugeConfig.forEach((config) => {
          const rawValue = Number(latest[config.key]) || 0;
          const percent = clampPercent(rawValue);
          const card = document.createElement("div");
          card.className = "gauge-card";
          card.innerHTML = `
            <div class="gauge" style="--value:${percent}; --color:${config.color};">
              <div class="gauge-center">
                <span class="gauge-value">${percent.toFixed(1)}%</span>
                <span class="gauge-caption">현재 사용률</span>
              </div>
            </div>
            <h3>${config.label}</h3>
          `;
          gaugeGrid.appendChild(card);
        });

        networkConfig.forEach((config) => {
          const rawValue = Number(latest[config.key]);
          const formatted = Number.isFinite(rawValue)
            ? rawValue.toFixed(2)
            : "-";
          const item = document.createElement("div");
          item.className = "metric-item";
          item.innerHTML = `
            <span class="label">${config.label}</span>
            <span class="value">${formatted}${config.suffix}</span>
          `;
          networkStats.appendChild(item);
        });
      }

      function renderLogs(rows, target) {
        target.innerHTML = "";
        if (!rows.length) {
          target.innerHTML = `
            <tr>
              <td colspan="3" class="empty-state">표시할 로그가 없습니다.</td>
            </tr>
          `;
          return;
        }

        rows.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.recorded_at}</td>
            <td>${row.source_timestamp ?? "-"}</td>
            <td>${row.message}</td>
          `;
          target.appendChild(tr);
        });
      }

      async function refresh() {
        try {
          const [metrics, syslogs, ipmiLogs] = await Promise.all([
            fetchJSON("/metrics/recent?limit=50"),
            fetchJSON("/logs/syslog?limit=25"),
            fetchJSON("/logs/ipmi?limit=25"),
          ]);

          renderUsageMetrics(metrics);
          renderLogs(syslogs, syslogTable);
          renderLogs(ipmiLogs, ipmiTable);

          syslogCount.textContent = `${syslogs.length} 건`;
          ipmiCount.textContent = `${ipmiLogs.length} 건`;
          lastUpdated.textContent = `마지막 업데이트: ${new Date().toLocaleString()}`;
        } catch (error) {
          gaugeGrid.innerHTML =
            '<p class="empty-state">메트릭을 불러오지 못했습니다.</p>';
          networkStats.innerHTML = "";
          syslogTable.innerHTML = `
            <tr><td colspan="3" class="empty-state">데이터 갱신 오류</td></tr>
          `;
          ipmiTable.innerHTML = `
            <tr><td colspan="3" class="empty-state">데이터 갱신 오류</td></tr>
          `;
          syslogCount.textContent = "0 건";
          ipmiCount.textContent = "0 건";
          metricTimestamp.textContent = "샘플 없음";
          lastUpdated.textContent = `데이터 갱신 오류: ${error.message}`;
        }
      }

      refresh();
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
