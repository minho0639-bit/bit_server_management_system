<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>BITWatch 서버모니터링 시스템</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css"
      integrity="sha512-4lKZfcia7bXwt8S6umbY0MNwXVGfx2J3AGcfQ1ao4RJgIIqfSaPYeVctdW00AfukbRfiFnb7ePNdkX+u3Eqdxw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"
      integrity="sha384-+LuMnHJMhWpxQxF1k3crkq1EanoIoCThByFW7jRFczYAB1nKQtvvwyK/+KqczRHB"
      crossorigin="anonymous"
    ></script>
    <style>
      :root {
        color-scheme: dark;
        --bg-primary: radial-gradient(circle at top left, #2f2bff, #0f172a 55%);
        --panel-bg: rgba(15, 23, 42, 0.85);
        --panel-border: rgba(148, 163, 184, 0.18);
        --panel-shadow: 0 25px 45px rgba(15, 23, 42, 0.45);
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.16);
        --badge-bg: rgba(129, 140, 248, 0.18);
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Sans KR", system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        background: var(--bg-primary);
        color: var(--text-primary);
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(145deg, rgba(59, 130, 246, 0.1), rgba(129, 140, 248, 0.05));
        pointer-events: none;
        z-index: -1;
      }

      header {
        padding: 2rem clamp(1.2rem, 4vw, 3rem);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1.5rem;
      }

      header .brand {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      header h1 {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      header p {
        margin: 0;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        padding: 0.5rem 1rem;
        border-radius: 999px;
        backdrop-filter: blur(14px);
        box-shadow: var(--panel-shadow);
        font-size: 0.85rem;
        color: var(--text-secondary);
      }

      main {
        padding: 0 clamp(1.2rem, 4vw, 3rem) 3rem;
        display: grid;
        gap: 1.5rem;
      }

      section {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 1.5rem;
        padding: clamp(1.2rem, 4vw, 1.8rem);
        backdrop-filter: blur(14px);
        box-shadow: var(--panel-shadow);
      }

      section h2 {
        margin-top: 0;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }

      .metric-card {
        background: rgba(15, 23, 42, 0.55);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 1rem;
        padding: 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }

      .metric-card::after {
        content: "";
        position: absolute;
        inset: -30% 60%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.35), transparent 60%);
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: -1;
      }

      .metric-card:hover::after {
        opacity: 1;
      }

      .metric-card h3 {
        margin: 0;
        font-size: 0.95rem;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .metric-card p {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        background: var(--badge-bg);
        border: 1px solid rgba(129, 140, 248, 0.35);
        padding: 0.2rem 0.65rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .chart-wrapper {
        position: relative;
        height: 340px;
        margin-top: 1rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }

      th,
      td {
        padding: 0.65rem 0.6rem;
        text-align: left;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        font-size: 0.85rem;
        vertical-align: top;
      }

      th {
        color: var(--text-secondary);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.06em;
      }

      tbody tr:hover {
        background: rgba(56, 189, 248, 0.06);
      }

      .empty-state {
        color: var(--text-secondary);
        font-size: 0.9rem;
        padding: 0.6rem;
      }

      @media (max-width: 960px) {
        header {
          flex-direction: column;
          align-items: flex-start;
        }

        .chart-wrapper {
          height: 280px;
        }
      }

      @media (max-width: 600px) {
        header {
          padding: 1.5rem;
        }

        main {
          padding: 0 1.5rem 2.5rem;
        }

        section {
          border-radius: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>BITWatch 서버모니터링 시스템</h1>
        <p>단일 서버 자원 및 이벤트를 실시간으로 모니터링합니다.</p>
      </div>
      <span class="status-pill" id="lastUpdated">데이터 준비중...</span>
    </header>
    <main>
      <section>
        <h2>실시간 자원 요약</h2>
        <div class="metric-grid" id="metricsGrid"></div>
        <div class="chart-wrapper">
          <canvas id="resourceChart" aria-label="자원 사용률 그래프"></canvas>
        </div>
      </section>
      <section>
        <h2>
          시스템 로그
          <span class="badge" id="syslogCount">0 건</span>
        </h2>
        <table>
          <thead>
            <tr>
              <th>수집 시각</th>
              <th>원본 시각</th>
              <th>메시지</th>
            </tr>
          </thead>
          <tbody id="syslogTable"></tbody>
        </table>
      </section>
      <section>
        <h2>
          IPMI SEL 이벤트
          <span class="badge" id="ipmiCount">0 건</span>
        </h2>
        <table>
          <thead>
            <tr>
              <th>수집 시각</th>
              <th>원본 시각</th>
              <th>메시지</th>
            </tr>
          </thead>
          <tbody id="ipmiTable"></tbody>
        </table>
      </section>
    </main>
    <script>
      const metricsGrid = document.getElementById("metricsGrid");
      const syslogTable = document.getElementById("syslogTable");
      const ipmiTable = document.getElementById("ipmiTable");
      const syslogCount = document.getElementById("syslogCount");
      const ipmiCount = document.getElementById("ipmiCount");
      const lastUpdated = document.getElementById("lastUpdated");
      const resourceCanvas = document.getElementById("resourceChart");

      const metricLabels = {
        cpu_percent: "CPU 사용률 (%)",
        memory_percent: "메모리 사용률 (%)",
        disk_percent: "디스크 사용률 (%)",
        net_sent: "송신 대역폭 (MB)",
        net_recv: "수신 대역폭 (MB)",
      };

      let resourceChart;

      async function fetchJSON(url) {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`요청 실패: ${response.status}`);
        }
        return response.json();
      }

      function renderMetricCards(metrics) {
        metricsGrid.innerHTML = "";
        if (!metrics.length) {
          metricsGrid.innerHTML = '<p class="empty-state">수집된 메트릭이 없습니다.</p>';
          return;
        }
        const latest = metrics[0];
        Object.entries(metricLabels).forEach(([key, label]) => {
          const card = document.createElement("div");
          card.className = "metric-card";
          card.innerHTML = `
            <h3>${label}</h3>
            <p>${Number(latest[key]).toFixed(2)}</p>
          `;
          metricsGrid.appendChild(card);
        });
      }

      function renderMetricChart(metrics) {
        if (!metrics.length) {
          if (resourceChart) {
            resourceChart.destroy();
            resourceChart = undefined;
          }
          return;
        }
        const chronological = [...metrics].reverse();
        const labels = chronological.map((row) =>
          (row.sampled_at || row.recorded_at).replace("T", " ").slice(0, 19)
        );
        const cpuData = chronological.map((row) => Number(row.cpu_percent));
        const memoryData = chronological.map((row) => Number(row.memory_percent));
        const diskData = chronological.map((row) => Number(row.disk_percent));
        const netSentData = chronological.map((row) => Number(row.net_sent));
        const netRecvData = chronological.map((row) => Number(row.net_recv));

        const datasets = [
          {
            label: "CPU %",
            data: cpuData,
            borderColor: "#38bdf8",
            backgroundColor: "rgba(56, 189, 248, 0.15)",
            tension: 0.35,
            fill: true,
            pointRadius: 2,
            yAxisID: "y",
          },
          {
            label: "메모리 %",
            data: memoryData,
            borderColor: "#c084fc",
            backgroundColor: "rgba(192, 132, 252, 0.18)",
            tension: 0.35,
            fill: true,
            pointRadius: 2,
            yAxisID: "y",
          },
          {
            label: "디스크 %",
            data: diskData,
            borderColor: "#f472b6",
            backgroundColor: "rgba(244, 114, 182, 0.18)",
            tension: 0.35,
            fill: true,
            pointRadius: 2,
            yAxisID: "y",
          },
          {
            label: "송신 MB",
            data: netSentData,
            borderColor: "#facc15",
            backgroundColor: "rgba(250, 204, 21, 0.16)",
            tension: 0.25,
            fill: false,
            borderDash: [5, 5],
            pointRadius: 2,
            yAxisID: "y1",
          },
          {
            label: "수신 MB",
            data: netRecvData,
            borderColor: "#34d399",
            backgroundColor: "rgba(52, 211, 153, 0.16)",
            tension: 0.25,
            fill: false,
            borderDash: [5, 5],
            pointRadius: 2,
            yAxisID: "y1",
          },
        ];

        if (!resourceChart) {
          resourceChart = new Chart(resourceCanvas, {
            type: "line",
            data: {
              labels,
              datasets,
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: {
                mode: "index",
                intersect: false,
              },
              plugins: {
                legend: {
                  labels: {
                    color: "#e2e8f0",
                  },
                },
                tooltip: {
                  backgroundColor: "rgba(15, 23, 42, 0.9)",
                  borderColor: "rgba(148, 163, 184, 0.2)",
                  borderWidth: 1,
                  padding: 10,
                  titleColor: "#e2e8f0",
                  bodyColor: "#e2e8f0",
                },
              },
              scales: {
                x: {
                  ticks: { color: "#94a3b8", maxRotation: 45, minRotation: 45 },
                  grid: { color: "rgba(148, 163, 184, 0.08)" },
                },
                y: {
                  beginAtZero: true,
                  max: 100,
                  ticks: { color: "#94a3b8", callback: (value) => `${value}%` },
                  grid: { color: "rgba(148, 163, 184, 0.08)" },
                },
                y1: {
                  beginAtZero: true,
                  position: "right",
                  ticks: { color: "#94a3b8", callback: (value) => `${value} MB` },
                  grid: { drawOnChartArea: false },
                },
              },
            },
          });
        } else {
          resourceChart.data.labels = labels;
          resourceChart.data.datasets.forEach((dataset, index) => {
            dataset.data = datasets[index].data;
          });
          resourceChart.update("none");
        }
      }

      function renderLogs(rows, target) {
        target.innerHTML = "";
        if (!rows.length) {
          target.innerHTML = `
            <tr>
              <td colspan="3" class="empty-state">표시할 로그가 없습니다.</td>
            </tr>
          `;
          return;
        }
        rows.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.recorded_at}</td>
            <td>${row.source_timestamp ?? "-"}</td>
            <td>${row.message}</td>
          `;
          target.appendChild(tr);
        });
      }

      async function refresh() {
        try {
          const [metrics, syslogs, ipmiLogs] = await Promise.all([
            fetchJSON("/metrics/recent?limit=50"),
            fetchJSON("/logs/syslog?limit=25"),
            fetchJSON("/logs/ipmi?limit=25"),
          ]);
          renderMetricCards(metrics);
          renderMetricChart(metrics);
          renderLogs(syslogs, syslogTable);
          renderLogs(ipmiLogs, ipmiTable);
          syslogCount.textContent = `${syslogs.length} 건`;
          ipmiCount.textContent = `${ipmiLogs.length} 건`;
          lastUpdated.textContent = `마지막 업데이트: ${new Date().toLocaleString()}`;
        } catch (error) {
          lastUpdated.textContent = `데이터 갱신 오류: ${error.message}`;
        }
      }

      refresh();
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
