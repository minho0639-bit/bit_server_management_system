<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Single-Server Monitoring Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css"
      integrity="sha512-4lKZfcia7bXwt8S6umbY0MNwXVGfx2J3AGcfQ1ao4RJgIIqfSaPYeVctdW00AfukbRfiFnb7ePNdkX+u3Eqdxw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        padding: 1.5rem;
        background: #1e293b;
        border-bottom: 1px solid #334155;
      }
      main {
        padding: 1.5rem;
        display: grid;
        gap: 1.5rem;
      }
      section {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 0.75rem;
        padding: 1.25rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.35);
      }
      h2 {
        margin-top: 0;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 0.5rem;
        text-align: left;
        border-bottom: 1px solid #334155;
        font-size: 0.875rem;
      }
      th {
        color: #94a3b8;
        font-weight: 600;
      }
      .badge {
        background: #22d3ee;
        color: #0f172a;
        padding: 0.1rem 0.4rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
      }
      .metric-card {
        background: #0f172a;
        border-radius: 0.75rem;
        padding: 1rem;
        border: 1px solid #334155;
      }
      .metric-card h3 {
        margin: 0;
        font-size: 0.9rem;
        color: #94a3b8;
      }
      .metric-card p {
        margin: 0.5rem 0 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      .timestamp {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-top: 1rem;
        text-align: right;
      }
      @media (max-width: 600px) {
        header,
        main {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Single-Server Monitoring Dashboard</h1>
      <p class="timestamp" id="lastUpdated">Loading...</p>
    </header>
    <main>
      <section>
        <h2>Latest Metrics</h2>
        <div class="metric-grid" id="metricsGrid"></div>
      </section>
      <section>
        <h2>
          Syslog Events
          <span class="badge" id="syslogCount">0</span>
        </h2>
        <table>
          <thead>
            <tr>
              <th>Recorded At</th>
              <th>Source TS</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="syslogTable"></tbody>
        </table>
      </section>
      <section>
        <h2>
          IPMI SEL Events
          <span class="badge" id="ipmiCount">0</span>
        </h2>
        <table>
          <thead>
            <tr>
              <th>Recorded At</th>
              <th>Source TS</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="ipmiTable"></tbody>
        </table>
      </section>
    </main>
    <script>
      const metricsGrid = document.getElementById("metricsGrid");
      const syslogTable = document.getElementById("syslogTable");
      const ipmiTable = document.getElementById("ipmiTable");
      const syslogCount = document.getElementById("syslogCount");
      const ipmiCount = document.getElementById("ipmiCount");
      const lastUpdated = document.getElementById("lastUpdated");

      const metricLabels = {
        cpu_percent: "CPU %",
        memory_percent: "Memory %",
        disk_percent: "Disk %",
        net_sent: "Network Sent (MB)",
        net_recv: "Network Recv (MB)",
      };

      async function fetchJSON(url) {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Failed request: ${response.status}`);
        }
        return response.json();
      }

      function renderMetrics(metrics) {
        metricsGrid.innerHTML = "";
        if (!metrics.length) {
          metricsGrid.innerHTML = "<p>No metric data available.</p>";
          return;
        }
        const latest = metrics[0];
        Object.entries(metricLabels).forEach(([key, label]) => {
          const card = document.createElement("div");
          card.className = "metric-card";
          card.innerHTML = `
            <h3>${label}</h3>
            <p>${Number(latest[key]).toFixed(2)}</p>
          `;
          metricsGrid.appendChild(card);
        });
      }

      function renderLogs(rows, target) {
        target.innerHTML = "";
        rows.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.recorded_at}</td>
            <td>${row.source_timestamp ?? "-"}</td>
            <td>${row.message}</td>
          `;
          target.appendChild(tr);
        });
      }

      async function refresh() {
        try {
          const [metrics, syslogs, ipmiLogs] = await Promise.all([
            fetchJSON("/metrics/recent?limit=10"),
            fetchJSON("/logs/syslog?limit=25"),
            fetchJSON("/logs/ipmi?limit=25"),
          ]);
          renderMetrics(metrics);
          renderLogs(syslogs, syslogTable);
          renderLogs(ipmiLogs, ipmiTable);
          syslogCount.textContent = syslogs.length;
          ipmiCount.textContent = ipmiLogs.length;
          lastUpdated.textContent = `Last updated: ${new Date().toLocaleString()}`;
        } catch (error) {
          lastUpdated.textContent = `Error updating data: ${error.message}`;
        }
      }

      refresh();
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
